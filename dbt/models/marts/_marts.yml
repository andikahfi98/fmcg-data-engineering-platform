version: 2

models:

  - name: dim_product
    columns:
      - name: product_key
        data_tests:
          - unique
          - not_null

      - name: product_id
        data_tests:
          - unique
          - not_null


  - name: dim_distributor
    columns:
      - name: distributor_key
        data_tests:
          - unique
          - not_null

      - name: distributor_id
        data_tests:
          - unique
          - not_null


  - name: dim_salesperson
    columns:
      - name: salesperson_key
        data_tests:
          - unique
          - not_null

      - name: salesperson_id
        data_tests:
          - unique
          - not_null


  - name: dim_outlet
    columns:
      - name: outlet_key
        data_tests:
          - unique
          - not_null

      - name: outlet_id
        data_tests:
          - unique
          - not_null


  - name: dim_date
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null

      - name: date_day
        data_tests:
          - unique
          - not_null


  - name: fact_sales

    columns:

      - name: sales_key
        data_tests:
          - unique
          - not_null

      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: distributor_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_distributor')
                field: distributor_key

      - name: salesperson_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_salesperson')
                field: salesperson_key

      - name: outlet_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_outlet')
                field: outlet_key

      - name: invoice_id
        data_tests:
          - not_null

      - name: quantity
        data_tests:
          - not_null

      - name: net_sales
        data_tests:
          - not_null